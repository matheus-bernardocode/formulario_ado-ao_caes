<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de adoção de cães</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Cadastro para Adoção de Cães</h2>

     <form id="form">
    <input type="text" id="nome" placeholder="Nome completo">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="text" id="cpf" placeholder="CPF">
    <input type="number" id="idade" placeholder="Idade">
    <input type="text" id="cidade" placeholder="Cidade">

    <select id="moradia">
      <option value="">Tipo de moradia</option>
      <option value="casa">Casa</option>
      <option value="apartamento">Apartamento</option>
    </select>

    <select id="quintal">
      <option value="">Possui quintal?</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <select id="pet">
      <option value="">Já teve pet?</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

      <input type="number" id="horas" placeholder="Quantas horas o animal ficará sozinho por dia">

    <textarea id="motivo" placeholder="Motivo da adoção"></textarea>

    <select id="permiteAnimais">
      <option value="">O apartamento permite animais?</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <select id="quintalSeguro">
      <option value="">O quintal é seguro?</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <textarea id="justificativa" placeholder="Justificativa caso o animal fique mais de 8 horas sozinho"></textarea>

    <select id="financeiro">
      <option value="">Possui condições financeiras?</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <select id="decisao">
      <option value="">Decidiu adotar hoje?</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>
     <label>
      <input type="checkbox" id="termo">
      Aceito o termo de responsabilidade
    </label>

    <button type="submit">Enviar</button>

    <p class="error" id="mensagemErro"></p>

  </form>

  <div id="resultado"></div>

  
  <script src="script.js"></script>
</body>
</html>
